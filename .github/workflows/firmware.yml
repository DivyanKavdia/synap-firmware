name: Build and publish pendant firmware
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'OTA_RELEASES.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'OTA_RELEASES.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SYNAP_RELEASE_BRANCH: ota-releases
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned ESP32 toolchain and board libraries
        run: |
          arduino-cli config init
          arduino-cli config set network.connection_timeout 600s
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel@1.15.2"
          arduino-cli lib install "NimBLE-Arduino@2.3.6"
      - name: Fix pinned Arduino BLE request ownership and live reads
        run: node tools/patch-arduino-ble.cjs "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.5/libraries/BLE/src"
      - name: Test production source, audio, OTA and hardware contracts
        run: |
          node tools/assemble-source.cjs --check
          SYNAP_ARDUINO_BLE_SRC="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.5/libraries/BLE/src" SYNAP_NIMBLE_SRC="$HOME/Arduino/libraries/NimBLE-Arduino/src" node --test tests/*.cjs
      - name: Prepare auditable S3, C3 and Chakshu production sources
        run: |
          mkdir -p prepared/synap_esp32s3 prepared/synap_esp32c3 prepared/synap_esp32c3_sd prepared/synap_esp32c3_sd_ota prepared/synap_chakshu
          cp synap_esp32s3/synap_esp32s3.ino prepared/synap_esp32s3/synap_esp32s3.ino
          node tools/materialize-target.cjs esp32c3-supermini-4m prepared/synap_esp32s3/synap_esp32s3.ino prepared/synap_esp32c3/synap_esp32c3.ino
          node tools/materialize-target.cjs esp32c3-supermini-4m-sd prepared/synap_esp32s3/synap_esp32s3.ino prepared/synap_esp32c3_sd/synap_esp32c3_sd.ino
          node tools/materialize-target.cjs esp32c3-supermini-4m-sd-ota prepared/synap_esp32s3/synap_esp32s3.ino prepared/synap_esp32c3_sd_ota/synap_esp32c3_sd_ota.ino
          cp partitions/c3-sd-dual-ota.csv prepared/synap_esp32c3_sd/partitions.csv
          node tools/materialize-target.cjs xiao-esp32s3-sense-8m prepared/synap_esp32s3/synap_esp32s3.ino prepared/synap_chakshu/synap_chakshu.ino
          test "$(git status --porcelain -- synap_esp32s3)" = ""
      - name: Verify lightweight TinyML Chakshu source
        run: |
          grep -q 'ChakshuVoice::scheduleInitialize();' prepared/synap_chakshu/synap_chakshu.ino
          grep -q 'LEARNED_WEIGHT_BYTES' prepared/synap_chakshu/synap_chakshu.ino
          grep -q 'WINDOW_SAMPLES=24000' prepared/synap_chakshu/synap_chakshu.ino
          ! grep -q 'esp_afe_sr' prepared/synap_chakshu/synap_chakshu.ino
          ! grep -q 'esp_mn_' prepared/synap_chakshu/synap_chakshu.ino
          ! grep -q 'SYNAP_EMBEDDED_SR_MODEL_START' prepared/synap_chakshu/synap_chakshu.ino
      - name: Compile S3, legacy C3, new C3+SD and Chakshu with one build number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          build=$((1000 + RUN_NUMBER))
          test "$build" -le 65535
          mkdir -p compiled-chakshu bundle/xiao-esp32s3-sense-8m compiled-s3 compiled-c3 compiled-c3-sd compiled-c3-sd-ota bundle/esp32s3-fh4r2-qspi-4m bundle/esp32c3-supermini-4m bundle/esp32c3-supermini-4m-sd bundle/esp32c3-supermini-4m-sd-ota bundle/source-sync
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M,PartitionScheme=default,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc' --build-property "compiler.cpp.extra_flags=-DSYNAP_BUILD=$build -DUSE_REAL_I2S_MIC=1" --output-dir compiled-s3 prepared/synap_esp32s3
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc' --build-property "compiler.optimization_flags=-Oz -ffunction-sections -fdata-sections" --build-property "compiler.c.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables" --build-property "compiler.cpp.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables -DSYNAP_BUILD=$build -DUSE_REAL_I2S_MIC=1" --build-property "compiler.c.elf.extra_flags=-Wl,--gc-sections" --output-dir compiled-chakshu prepared/synap_chakshu
          # C3 now uses ESP-IDF native SDSPI/FatFs, not patched Arduino SD.
          # S3 and Chakshu compile unchanged above.
          ! grep -q 'SYNAP_SD_C3_CMD24_ONLY' "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.5/libraries/SD/src/sd_diskio.cpp"
          grep -q 'esp_vfs_fat_sdspi_mount' prepared/synap_esp32c3/synap_esp32c3.ino
          # C3 BLE-only image must fit the original 1.25 MiB OTA slots. Apply
          # size-only compiler/linker flags; do not change the deployed partition table.
          arduino-cli compile --fqbn 'esp32:esp32:esp32c3:FlashSize=4M,PartitionScheme=default,CDCOnBoot=cdc' --build-property "compiler.optimization_flags=-Oz -ffunction-sections -fdata-sections" --build-property "compiler.c.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables" --build-property "compiler.cpp.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables -DSYNAP_BUILD=$build -DUSE_REAL_I2S_MIC=1" --build-property "compiler.c.elf.extra_flags=-Wl,--gc-sections" --output-dir compiled-c3 prepared/synap_esp32c3
          test "$(stat -c%s compiled-c3/synap_esp32c3.ino.bin)" -le 1310720
          # Only factory-provisioned new C3+SD has the 1.875MiB x2 app table.
          # Never change the shipped C3's original 1.25MiB x2 OTA layout.
          arduino-cli compile --fqbn 'esp32:esp32:esp32c3:FlashSize=4M,PartitionScheme=default,CDCOnBoot=cdc' --build-property 'upload.maximum_size=1966080' --build-property "compiler.optimization_flags=-Oz -ffunction-sections -fdata-sections" --build-property "compiler.c.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables" --build-property "compiler.cpp.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables -DSYNAP_BUILD=$build -DUSE_REAL_I2S_MIC=1" --build-property "compiler.c.elf.extra_flags=-Wl,--gc-sections" --output-dir compiled-c3-sd prepared/synap_esp32c3_sd
          test "$(stat -c%s compiled-c3-sd/synap_esp32c3_sd.ino.bin)" -le 1966080
          node tools/verify-c3-sd-layout.cjs compiled-c3-sd/synap_esp32c3_sd.ino.partitions.bin
          # Opt-in application-only OTA. Preserve existing C3 identity and product
          # marker; do not install/change the device's pre-provisioned partition table.
          arduino-cli compile --fqbn 'esp32:esp32:esp32c3:FlashSize=4M,PartitionScheme=default,CDCOnBoot=cdc' --build-property 'upload.maximum_size=1966080' --build-property "compiler.optimization_flags=-Oz -ffunction-sections -fdata-sections" --build-property "compiler.c.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables" --build-property "compiler.cpp.extra_flags=-fno-unwind-tables -fno-asynchronous-unwind-tables -DSYNAP_BUILD=$build -DUSE_REAL_I2S_MIC=1" --build-property "compiler.c.elf.extra_flags=-Wl,--gc-sections" --output-dir compiled-c3-sd-ota prepared/synap_esp32c3_sd_ota
          test "$(stat -c%s compiled-c3-sd-ota/synap_esp32c3_sd_ota.ino.bin)" -le 1966080
          test "$(stat -c%s compiled-c3-sd-ota/synap_esp32c3_sd_ota.ino.bin)" -gt 0
          test "$(stat -c%s compiled-chakshu/synap_chakshu.ino.bin)" -le 3342336
          node tools/release.cjs compiled-chakshu/synap_chakshu.ino.bin "$build" "$GITHUB_SHA" bundle/xiao-esp32s3-sense-8m "$SYNAP_RELEASE_BRANCH" prepared/synap_chakshu/synap_chakshu.ino xiao-esp32s3-sense-8m
          node tools/release.cjs compiled-s3/synap_esp32s3.ino.bin "$build" "$GITHUB_SHA" bundle/esp32s3-fh4r2-qspi-4m "$SYNAP_RELEASE_BRANCH" prepared/synap_esp32s3/synap_esp32s3.ino esp32s3-fh4r2-qspi-4m
          node tools/release.cjs compiled-c3/synap_esp32c3.ino.bin "$build" "$GITHUB_SHA" bundle/esp32c3-supermini-4m "$SYNAP_RELEASE_BRANCH" prepared/synap_esp32c3/synap_esp32c3.ino esp32c3-supermini-4m
          node tools/release.cjs compiled-c3-sd/synap_esp32c3_sd.ino.bin "$build" "$GITHUB_SHA" bundle/esp32c3-supermini-4m-sd "$SYNAP_RELEASE_BRANCH" prepared/synap_esp32c3_sd/synap_esp32c3_sd.ino esp32c3-supermini-4m-sd
          node tools/release.cjs compiled-c3-sd-ota/synap_esp32c3_sd_ota.ino.bin "$build" "$GITHUB_SHA" bundle/esp32c3-supermini-4m-sd-ota "$SYNAP_RELEASE_BRANCH" prepared/synap_esp32c3_sd_ota/synap_esp32c3_sd_ota.ino esp32c3-supermini-4m-sd-ota
          s3_factory="$(find compiled-s3 -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
          c3_factory="$(find compiled-c3 -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
          c3sd_factory="$(find compiled-c3-sd -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
          test -n "$s3_factory" && test -n "$c3_factory" && test -n "$c3sd_factory"
          cp "$s3_factory" bundle/esp32s3-fh4r2-qspi-4m/factory.bin
          cp "$c3_factory" bundle/esp32c3-supermini-4m/factory.bin
          cp "$c3sd_factory" bundle/esp32c3-supermini-4m-sd/factory.bin
          cp partitions/c3-sd-dual-ota.csv bundle/esp32c3-supermini-4m-sd/partitions.csv
          cp compiled-c3-sd/synap_esp32c3_sd.ino.partitions.bin bundle/esp32c3-supermini-4m-sd/partitions.bin
          chakshu_factory="$(find compiled-chakshu -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
          test -n "$chakshu_factory"
          cp "$chakshu_factory" bundle/xiao-esp32s3-sense-8m/factory.bin
          cp prepared/synap_chakshu/synap_chakshu.ino bundle/source-sync/synap_chakshu.ino
          cp prepared/synap_esp32s3/synap_esp32s3.ino bundle/source-sync/synap_esp32s3.ino
          cp prepared/synap_esp32c3/synap_esp32c3.ino bundle/source-sync/synap_esp32c3.ino
          cp prepared/synap_esp32c3_sd/synap_esp32c3_sd.ino bundle/source-sync/synap_esp32c3_sd.ino
          cp prepared/synap_esp32c3_sd_ota/synap_esp32c3_sd_ota.ino bundle/source-sync/synap_esp32c3_sd_ota.ino
      - uses: actions/upload-artifact@v4
        with:
          name: verified-firmware
          path: bundle/
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SYNAP_RELEASE_BRANCH: ota-releases
      # Explicit target tags restrict publication; ordinary builds retain all targets.
      SYNAP_PUBLISH_TARGETS: ${{ contains(github.event.head_commit.message, '[c3-sd-only]') && 'c3-sd-only' || contains(github.event.head_commit.message, '[chakshu-only]') && 'xiao-esp32s3-sense-8m' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-firmware
          path: bundle
      - name: Confirm this source is still the main release candidate
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api repos/DivyanKavdia/synap-firmware/commits/main --jq .sha)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Current source $GITHUB_SHA is eligible for production publish."
          else
            changed="$(gh api "repos/DivyanKavdia/synap-firmware/compare/$GITHUB_SHA...$current" --jq '.files[].filename')"
            release_affecting="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|OTA_RELEASES\.md|docs/)' || true)"
            if [ -n "$changed" ] && [ -z "$release_affecting" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Main advanced only through firmware-ignored documentation; verified source $GITHUB_SHA remains eligible."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Source $GITHUB_SHA was superseded by release-affecting changes in $current; skipping production publish."
            fi
          fi
      - name: Attest ESP32-S3 production firmware with GitHub OIDC
        if: steps.current.outputs.release == 'true' && env.SYNAP_PUBLISH_TARGETS == ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bundle/esp32s3-fh4r2-qspi-4m/firmware.bin
      - name: Attest ESP32-C3 production firmware with GitHub OIDC
        if: steps.current.outputs.release == 'true' && env.SYNAP_PUBLISH_TARGETS == ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bundle/esp32c3-supermini-4m/firmware.bin
      - name: Attest factory-only C3+SD firmware with GitHub OIDC
        if: steps.current.outputs.release == 'true' && (env.SYNAP_PUBLISH_TARGETS == '' || env.SYNAP_PUBLISH_TARGETS == 'c3-sd-only')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bundle/esp32c3-supermini-4m-sd/firmware.bin
      - name: Attest opt-in existing large-slot C3+SD firmware with GitHub OIDC
        if: steps.current.outputs.release == 'true' && (env.SYNAP_PUBLISH_TARGETS == '' || env.SYNAP_PUBLISH_TARGETS == 'c3-sd-only')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bundle/esp32c3-supermini-4m-sd-ota/firmware.bin
      - name: Attest Chakshu firmware with GitHub OIDC
        if: steps.current.outputs.release == 'true' && env.SYNAP_PUBLISH_TARGETS != 'c3-sd-only'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bundle/xiao-esp32s3-sense-8m/firmware.bin
      - name: Publish production firmware atomically
        id: publish_result
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish.cjs
      - name: Verify public manifests, binaries, GitHub provenance and CORS
        if: steps.publish_result.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check-feed.cjs
