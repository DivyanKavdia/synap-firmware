name: Build and publish pendant firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNAP_RELEASE_BRANCH: ota-releases
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned ESP32 toolchain and LED library
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel@1.15.2"
      - name: Test release and OTA validation
        run: node --test tests/*.cjs
      - name: Compile application (4 MB flash, QSPI PSRAM, default dual OTA slots)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          build=$((1000 + RUN_NUMBER))
          test "$build" -le 65535
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=4M,PartitionScheme=default,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc' --build-property "compiler.cpp.extra_flags=-DSYNAP_BUILD=$build" --output-dir compiled synap_esp32s3
          node tools/release.cjs compiled/synap_esp32s3.ino.bin "$build" "$GITHUB_SHA" bundle "$SYNAP_RELEASE_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-firmware
          path: bundle/
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SYNAP_RELEASE_BRANCH: ota-releases
      SYNAP_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.SYNAP_RELEASE_PRIVATE_KEY_PEM }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-firmware
          path: bundle
      - name: Sign production manifest
        run: node tools/sign-manifest.cjs bundle/latest.json
      - name: Publish production firmware atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish.cjs
      - name: Verify public manifest, binary, signature policy and CORS
        run: node tools/check-feed.cjs
